<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2b1b16">
<title>Produksi - Legitta Bakery</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brown:#2b1b16;--cream:#f7f0e5;--paper:#fffaf2;--gold:#b58b50;--muted:#806f62;--line:#e8dccb}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--brown);font:15px/1.5 Georgia,serif}
header{background:var(--brown);color:#fff8ed;padding:23px 16px;text-align:center;border-bottom:4px solid var(--gold)}
.brand{font-size:26px;letter-spacing:3px;font-weight:bold}
.tag{font:11px Arial;letter-spacing:2px;color:#d9bd91;margin-top:5px}
main{max-width:980px;margin:26px auto;padding:0 14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:20px;margin:14px 0}
h2{font-size:21px;margin:0 0 13px}
label{display:block;font:12px Arial;color:var(--muted);margin:11px 0 5px}
input,select,button{font:14px Arial}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--brown)}
button{border:0;border-radius:8px;background:var(--brown);color:#fff;padding:11px 14px;cursor:pointer;margin:8px 6px 0 0}
button.secondary{background:#eadcc8;color:var(--brown)}
.muted{color:var(--muted);font:13px Arial,sans-serif}
.hidden{display:none!important}
.status{padding:10px 12px;border-radius:8px;background:#f1e8da;margin:12px 0;font:13px Arial;white-space:pre-wrap}
.item{border:1px solid var(--line);padding:13px;border-radius:9px;margin:9px 0;background:#fff}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.qty{font-size:22px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.total{background:#fff8ed;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px}
.order-line{font:12px Arial;color:var(--muted);padding:3px 0}
footer{text-align:center;color:var(--muted);font:12px Arial;padding:28px}
@media(max-width:480px){.brand{font-size:22px}.panel{padding:15px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
 <div class="brand">LEGITTA BAKERY</div>
 <div class="tag">REKAP PRODUKSI</div>
</header>
<main>
 <div id="msg" class="status">Memeriksa akses…</div>

 <div id="content" class="hidden">
  <div class="panel">
   <div class="row"><h2 style="margin:0">Rekap Produksi</h2><button class="secondary" id="backBtn">← Kembali</button></div>
   <p class="muted">Total produk dari pesanan yang masih berjalan (belum selesai / dibatalkan).</p>
   <div class="grid">
    <div><label>Periode</label><select id="periodFilter"><option value="">Semua periode</option></select></div>
    <div><label>Tanggal pengambilan</label><input id="dateFilter" type="date"></div>
   </div>
   <button id="applyBtn">Terapkan</button>
   <button id="resetBtn" class="secondary">Reset</button>
   <button id="refreshBtn" class="secondary">Muat Ulang</button>
  </div>

  <div class="panel">
   <h2>Yang Harus Diproduksi</h2>
   <div id="recap" class="muted">Memuat…</div>
   <div id="totalBox" class="total hidden"></div>
  </div>
 </div>
</main>
<footer>LEGITTA BAKERY · Since 2009</footer>

<script>
const SUPABASE_URL="https://araecdddcwgidpzwvsly.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_UNxMd5oFYFo6bPMk6xFUVQ_gudkAtaI";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DONE=["completed","cancelled","selesai","dibatalkan"];
let orders=[],items=[],periods=[];

$("backBtn").onclick=()=>{window.location.href="index.html"};

async function init(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){$("msg").textContent="Silakan login dulu di halaman utama.\nMengalihkan…";setTimeout(()=>location.href="index.html",1500);return}
 const {data:profile,error}=await db.from("profiles").select("role,is_active").eq("id",session.user.id).maybeSingle();
 if(error||!profile||profile.role!=="admin"||profile.is_active===false){$("msg").textContent="Halaman ini hanya untuk admin.";return}
 $("msg").classList.add("hidden");$("content").classList.remove("hidden");
 await loadData();
}

async function loadData(){
 $("recap").textContent="Memuat…";
 const [o,p]=await Promise.all([
  db.from("orders").select("id,order_number,period_id,pickup_date,order_status,reseller_id"),
  db.from("order_periods").select("id,name").order("created_at",{ascending:false})
 ]);
 if(o.error){$("recap").textContent="Gagal memuat pesanan: "+o.error.message;return}
 periods=p.data||[];
 const cur=$("periodFilter").value;
 $("periodFilter").innerHTML='<option value="">Semua periode</option>'+periods.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
 $("periodFilter").value=cur;
 orders=(o.data||[]).filter(x=>!DONE.includes(String(x.order_status||"").toLowerCase()));
 const ids=orders.map(x=>x.id);
 items=[];
 if(ids.length){
  const r=await db.from("order_items").select("order_id,product_name,quantity").in("order_id",ids);
  if(r.error){$("recap").textContent="Gagal memuat detail produk: "+r.error.message;return}
  items=r.data||[];
 }
 render();
}

function render(){
 const pid=$("periodFilter").value,date=$("dateFilter").value;
 const ok=new Map();
 orders.forEach(o=>{
  if(pid&&String(o.period_id)!==String(pid))return;
  if(date&&o.pickup_date!==date)return;
  ok.set(o.id,o);
 });
 const sum={};
 items.forEach(i=>{
  const o=ok.get(i.order_id);if(!o)return;
  const k=i.product_name||"Tanpa nama";
  (sum[k]??={qty:0,orders:[]});
  sum[k].qty+=Number(i.quantity)||0;
  sum[k].orders.push(`${o.order_number} × ${i.quantity}`);
 });
 const rows=Object.entries(sum).sort((a,b)=>b[1].qty-a[1].qty);
 if(!rows.length){$("recap").textContent="Tidak ada produk yang perlu diproduksi untuk filter ini.";$("totalBox").classList.add("hidden");return}
 $("recap").innerHTML=rows.map(([name,d])=>`<div class="item"><div class="row"><b>${esc(name)}</b><span class="qty">${d.qty}</span></div>${d.orders.map(t=>`<div class="order-line">${esc(t)}</div>`).join("")}</div>`).join("");
 const total=rows.reduce((s,[,d])=>s+d.qty,0);
 $("totalBox").innerHTML=`<div class="row"><b>Total semua produk</b><b class="qty">${total}</b></div><div class="muted">Dari ${ok.size} pesanan aktif</div>`;
 $("totalBox").classList.remove("hidden");
}

$("applyBtn").onclick=render;
$("resetBtn").onclick=()=>{$("periodFilter").value="";$("dateFilter").value="";render()};
$("refreshBtn").onclick=loadData;
init();
</script>
</body>
</html>
